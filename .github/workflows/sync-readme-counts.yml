name: Sync README counts from metrics.json

on:
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC
  workflow_dispatch:       # manual trigger
  push:
    branches: [main]
    paths: ['metrics.json']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read metrics and update README
        run: |
          ACTIVE=$(jq -r '.active_checks' metrics.json)
          PASSIVE=$(jq -r '.passive_checks' metrics.json)
          MCP=$(jq -r '.mcp_tools' metrics.json)
          echo "Active: $ACTIVE  Passive: $PASSIVE  MCP: $MCP"
          sed -i -E "s/### Active scanner — [0-9]+ checks/### Active scanner — $ACTIVE checks/" README.md
          sed -i -E "s/### Passive scanner — [0-9]+ checks/### Passive scanner — $PASSIVE checks/" README.md
          sed -i -E "s/### AI agent — [0-9]+ MCP tools/### AI agent — $MCP MCP tools/" README.md
          sed -i -E "s/Full [0-9]+-tool MCP surface/Full $MCP-tool MCP surface/" README.md

      - name: Commit if changed
        run: |
          git diff --exit-code README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "README: sync counts from metrics.json"
          git push
